services:
  postgres:
    image: postgres:13
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    # image: ${DOCKERHUB_USERNAME}/kittygram_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    restart: always
    volumes:
      - static:/app/static/
      - media:/app/media/
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    # image: ${DOCKERHUB_USERNAME}/kittygram_frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: sh -c "npx http-server /app/build -p 8000"
    restart: always
    volumes:
      - static:/app/static/
    depends_on:
      - backend

  gateway:
    # image: ${DOCKERHUB_USERNAME}/kittygram_gateway:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/var/html/static/
      - media:/var/html/media/

volumes:
  pg_data:
  static:
  media:
