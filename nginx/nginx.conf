server {
  listen 80;
  index index.html;

  location ~ ^/(api|admin)/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:9000;
    client_max_body_size 20M;
  }

  location /media/ {
    alias /app/media/;
  }

  location / {
    alias /staticfiles/;
    try_files $uri $uri/ /index.html;
  }
}
